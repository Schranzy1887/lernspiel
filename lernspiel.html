<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learn German with Andree</title>
    <style>
        /* --- DESIGN UND LAYOUT --- */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f8ff;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transition: background-image 2s ease-in-out;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255, 255, 255, 0.7);
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 2;
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 700px;
            width: 90%;
            max-height: 90vh; /* Verhindert, dass das Fenster bei 5 Buttons zu groß wird */
            overflow-y: auto; /* Erlaubt scrollen, falls das Handy-Display klein ist */
            border: 3px solid #ffb6c1;
        }

        h1 {
            font-size: 2.5em;
            color: #333;
            margin-bottom: 10px;
        }

        .credits {
            font-size: 1.2em;
            color: #e83e8c;
            font-weight: bold;
            font-style: italic;
            margin-bottom: 30px;
        }

        button {
            background-color: #4CAF50;
            border: none;
            color: white;
            padding: 15px 30px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 20px;
            margin: 10px;
            cursor: pointer;
            border-radius: 10px;
            transition: background-color 0.3s, transform 0.1s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        button:hover { background-color: #45a049; }
        button:active { transform: scale(0.95); }
        
        .btn-music { background-color: #008CBA; }
        .btn-music:hover { background-color: #007bb5; }
        .btn-option { background-color: #f39c12; width: 100%; margin: 8px 0; font-size: 20px; padding: 12px 20px; }
        .btn-option:hover { background-color: #e67e22; }

        input[type="text"] {
            width: 80%;
            padding: 15px;
            font-size: 24px;
            margin: 20px 0;
            border: 2px solid #ccc;
            border-radius: 10px;
            text-align: center;
        }

        .question-text { font-size: 28px; font-weight: bold; color: #222; margin-bottom: 10px; }
        .translation-text { font-size: 22px; color: #555; margin-bottom: 20px; font-style: italic; }
        
        .feedback { font-size: 24px; font-weight: bold; margin-top: 15px; min-height: 30px; }
        .correct { color: #27ae60; }
        .wrong { color: #c0392b; }

        .stats {
            display: flex;
            justify-content: space-between;
            font-size: 20px;
            font-weight: bold;
            color: #444;
            margin-bottom: 15px;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }

        #achievement-popup {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #f1c40f, #f39c12);
            color: white;
            padding: 20px 40px;
            border-radius: 50px;
            font-size: 24px;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            z-index: 999;
            display: none;
            animation: popDown 0.5s ease-out;
            border: 3px solid #fff;
        }

        @keyframes popDown {
            from { top: -100px; opacity: 0; }
            to { top: 20px; opacity: 1; }
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="overlay"></div>

    <div id="achievement-popup">🏆 Achievement Unlocked!</div>

    <audio id="bgMusic" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <!-- MAIN MENU -->
    <div class="container" id="menu-screen">
        <h1>Learn German with Love</h1>
        <div class="credits">programmed by Andree Sonnenberg for intensive learning &lt;3</div>
        <button onclick="startGame()">Start Learning!</button><br>
        <button class="btn-music" id="musicToggleBtn" onclick="toggleMusic()">Music: OFF</button>
        <p style="margin-top: 20px; font-size: 18px; color: #666;">
            A mix of reading, writing, vocabulary, and grammar!
        </p>
    </div>

    <!-- GAME SCREEN -->
    <div class="container hidden" id="game-screen">
        <div class="stats">
            <div>Score: <span id="scoreDisplay">0</span></div>
            <div>Level: A1-A2</div>
        </div>

        <div id="questionArea">
            <div class="question-text" id="qText">Loading question...</div>
            <div class="translation-text" id="tText">Loading translation...</div>
            
            <div id="typeArea" class="hidden">
                <input type="text" id="answerInput" placeholder="Type German here..." autocomplete="off">
                <br>
                <button onclick="checkAnswer()">Submit</button>
            </div>

            <!-- FÜR 4-5 MULTIPLE CHOICE BUTTONS -->
            <div id="choiceArea" class="hidden">
                <button class="btn-option" id="btnOpt1" onclick="checkChoice(1)">Option 1</button>
                <button class="btn-option" id="btnOpt2" onclick="checkChoice(2)">Option 2</button>
                <button class="btn-option" id="btnOpt3" onclick="checkChoice(3)">Option 3</button>
                <button class="btn-option" id="btnOpt4" onclick="checkChoice(4)">Option 4</button>
                <button class="btn-option" id="btnOpt5" onclick="checkChoice(5)">Option 5</button>
            </div>
        </div>

        <div class="feedback" id="feedbackArea"></div>
        <button id="nextBtn" class="hidden" onclick="nextQuestion()" style="background-color: #8e44ad; width: 100%;">Next Question ➔</button>
    </div>

    <script>
        const images = ["andree.jpg", "PaquibotRA30081990.png"];
        let imgIndex = 0;
        
        function changeBackground() {
            document.body.style.backgroundImage = `url('${images[imgIndex]}')`;
            imgIndex = (imgIndex + 1) % images.length;
        }
        changeBackground(); 
        setInterval(changeBackground, 12000); 

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'correct') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'achievement') {
                osc.type = 'square';
                const now = audioCtx.currentTime;
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.setValueAtTime(500, now + 0.1);
                osc.frequency.setValueAtTime(600, now + 0.2);
                osc.frequency.setValueAtTime(800, now + 0.3);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.6);
                osc.start(); osc.stop(now + 0.6);
            }
        }

        let musicPlaying = false;
        function toggleMusic() {
            const bgm = document.getElementById("bgMusic");
            const btn = document.getElementById("musicToggleBtn");
            if (musicPlaying) {
                bgm.pause();
                btn.innerText = "Music: OFF";
                btn.style.backgroundColor = "#008CBA";
                musicPlaying = false;
            } else {
                bgm.volume = 0.4;
                bgm.play().then(() => {
                    btn.innerText = "Music: ON 🎵";
                    btn.style.backgroundColor = "#27ae60";
                    musicPlaying = true;
                }).catch(e => {
                    alert("Bitte stelle sicher, dass eine Datei namens music.mp3 im Ordner liegt! Fehler: " + e);
                });
            }
        }

        const vocabDB = [
            { de: "Hallo", en: "Hello", ceb: "Kumusta" },
            { de: "Tschüss", en: "Goodbye", ceb: "Babay / Amping" },
            { de: "Bitte", en: "Please", ceb: "Palihug" },
            { de: "Danke", en: "Thank you", ceb: "Salamat" },
            { de: "Ja", en: "Yes", ceb: "Oo" },
            { de: "Nein", en: "No", ceb: "Dili" },
            { de: "Wasser", en: "Water", ceb: "Tubig" },
            { de: "Essen", en: "Food", ceb: "Pagkaon" },
            { de: "Liebe", en: "Love", ceb: "Gugma" },
            { de: "Freundin", en: "Girlfriend", ceb: "Uyab (babaye)" },
            { de: "Freund", en: "Boyfriend / Friend", ceb: "Uyab / Higala" },
            { de: "Schön", en: "Beautiful", ceb: "Gwapa / Nindot" },
            { de: "Gut", en: "Good", ceb: "Maayo" },
            { de: "Schlecht", en: "Bad", ceb: "Bati" },
            { de: "Groß", en: "Big", ceb: "Dako" },
            { de: "Klein", en: "Small", ceb: "Gamay" },
            { de: "Haus", en: "House", ceb: "Balay" },
            { de: "Hund", en: "Dog", ceb: "Iro" },
            { de: "Katze", en: "Cat", ceb: "Iring" },
            { de: "Guten Morgen", en: "Good morning", ceb: "Maayong buntag" },
            { de: "Gute Nacht", en: "Good night", ceb: "Maayong gabii" },
            { de: "Ich", en: "I", ceb: "Ako" },
            { de: "Du", en: "You", ceb: "Ikaw" },
            { de: "Wir", en: "We", ceb: "Kita / Kami" },
            { de: "Frau", en: "Woman", ceb: "Babaye" },
            { de: "Mann", en: "Man", ceb: "Lalaki" },
            { de: "Heute", en: "Today", ceb: "Karon (adlaw)" },
            { de: "Morgen", en: "Tomorrow", ceb: "Ugma" },
            { de: "Gestern", en: "Yesterday", ceb: "Kagahapon" },
            { de: "Zeit", en: "Time", ceb: "Oras" },
            { de: "Geld", en: "Money", ceb: "Kwarta" },
            { de: "Arbeit", en: "Work", ceb: "Trabaho" },
            { de: "Müde", en: "Tired", ceb: "Gikapoy" },
            { de: "Glücklich", en: "Happy", ceb: "Malipayon" },
            { de: "Traurig", en: "Sad", ceb: "Naguol" }
        ];

        const sentenceDB = [
            { de: "Ich ___ dich.", answer: "liebe", en: "I love you.", ceb: "Gihigugma tika." },
            { de: "Du ___ sehr schön.", answer: "bist", en: "You are very beautiful.", ceb: "Gwapa kaayo ka." },
            { de: "Wir ___ nach Hause.", answer: "gehen", en: "We are going home.", ceb: "Mouli na ta." },
            { de: "Ich ___ Hunger.", answer: "habe", en: "I am hungry.", ceb: "Gigutom ko." },
            { de: "Ich ___ Wasser.", answer: "trinke", en: "I drink water.", ceb: "Niinom ko og tubig." },
            { de: "Wo ___ die Toilette?", answer: "ist", en: "Where is the toilet?", ceb: "Asa ang kasilyas?" },
            { de: "Das ist ___ Freund.", answer: "mein", en: "This is my boyfriend.", ceb: "Kani akong uyab." },
            { de: "Ich ___ Deutsch.", answer: "lerne", en: "I learn German.", ceb: "Nagkat-on ko og German." },
            { de: "Was ___ du?", answer: "machst", en: "What are you doing?", ceb: "Unsay gibuhat nimo?" },
            { de: "Mir ___ kalt.", answer: "ist", en: "I am cold.", ceb: "Gitugnaw ko." },
            { de: "Er ___ ein Buch.", answer: "liest", en: "He reads a book.", ceb: "Nagbasa siya og libro." },
            { de: "Wir ___ Reis.", answer: "essen", en: "We eat rice.", ceb: "Nikaon ta og bugas." },
            { de: "Wie ___ es dir?", answer: "geht", en: "How are you?", ceb: "Kumusta ka?" },
            { de: "Ich ___ müde.", answer: "bin", en: "I am tired.", ceb: "Gikapoy ko." },
            { de: "Kannst du mir ___?", answer: "helfen", en: "Can you help me?", ceb: "Pwede ko nimo tabangan?" }
        ];

        const units = ["", "eins", "zwei", "drei", "vier", "fünf", "sechs", "sieben", "acht", "neun"];
        const teens = ["zehn", "elf", "zwölf", "dreizehn", "vierzehn", "fünfzehn", "sechzehn", "siebzehn", "achtzehn", "neunzehn"];
        const tens = ["", "zehn", "zwanzig", "dreißig", "vierzig", "fünfzig", "sechzig", "siebzig", "achtzig", "neunzig"];
        
        for (let i = 1; i <= 100; i++) {
            let deWord = "";
            if (i < 10) deWord = units[i];
            else if (i >= 10 && i < 20) deWord = teens[i - 10];
            else if (i === 100) deWord = "hundert";
            else {
                let u = i % 10;
                let t = Math.floor(i / 10);
                if (u === 0) deWord = tens[t];
                else if (u === 1) deWord = "einund" + tens[t];
                else deWord = units[u] + "und" + tens[t];
            }
            vocabDB.push({ de: deWord, en: `Number ${i}`, ceb: `Numero ${i}` });
        }

        let score = 0;
        let currentQuestion = null;
        let questionType = 0; 
        let correctChoice = 0;

        const achievements = [1, 5, 10, 15, 20, 25, 30, 40, 50, 60, 70, 80, 90, 100, 150];
        let achievedLevels = [];

        function startGame() {
            document.getElementById("menu-screen").classList.add("hidden");
            document.getElementById("game-screen").classList.remove("hidden");
            
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            nextQuestion();
        }

        function nextQuestion() {
            document.getElementById("feedbackArea").innerText = "";
            document.getElementById("answerInput").value = "";
            document.getElementById("answerInput").classList.remove("hidden");
            document.getElementById("nextBtn").classList.add("hidden");
            document.getElementById("typeArea").classList.add("hidden");
            document.getElementById("choiceArea").classList.add("hidden");

            questionType = Math.floor(Math.random() * 3);

            if (questionType === 0) {
                currentQuestion = vocabDB[Math.floor(Math.random() * vocabDB.length)];
                document.getElementById("qText").innerText = `Write in German:`;
                document.getElementById("tText").innerText = `🇬🇧 ${currentQuestion.en} \n🇵🇭 ${currentQuestion.ceb}`;
                document.getElementById("typeArea").classList.remove("hidden");
                document.getElementById("answerInput").focus();
                
            } else if (questionType === 1) {
                // MULTIPLE CHOICE MIT 4 ODER 5 BUTTONS
                currentQuestion = vocabDB[Math.floor(Math.random() * vocabDB.length)];
                document.getElementById("qText").innerText = `What does this mean?`;
                document.getElementById("tText").innerText = `🇩🇪 "${currentQuestion.de}"`;
                document.getElementById("choiceArea").classList.remove("hidden");

                // Entscheide zufällig: 4 oder 5 Auswahlmöglichkeiten
                let numOptions = (Math.random() < 0.5) ? 4 : 5;
                correctChoice = Math.floor(Math.random() * numOptions) + 1;

                // Finde (numOptions - 1) eindeutige falsche Antworten
                let wrongAnswers = [];
                while (wrongAnswers.length < (numOptions - 1)) {
                    let randomVocab = vocabDB[Math.floor(Math.random() * vocabDB.length)];
                    // Darf nicht die richtige Antwort sein und nicht schon in der Liste der falschen Antworten
                    if (randomVocab.de !== currentQuestion.de && !wrongAnswers.some(v => v.de === randomVocab.de)) {
                        wrongAnswers.push(randomVocab);
                    }
                }

                // Alle 5 Buttons verstecken, bevor wir die nötigen einblenden
                for(let i = 1; i <= 5; i++) {
                    document.getElementById("btnOpt" + i).style.display = "none";
                }

                // Buttons belegen und einblenden
                let wrongIndex = 0;
                for(let i = 1; i <= numOptions; i++) {
                    let btn = document.getElementById("btnOpt" + i);
                    btn.style.display = "block"; // Einblenden
                    
                    if (i === correctChoice) {
                        btn.innerText = `🇬🇧 ${currentQuestion.en} / 🇵🇭 ${currentQuestion.ceb}`;
                    } else {
                        let w = wrongAnswers[wrongIndex];
                        btn.innerText = `🇬🇧 ${w.en} / 🇵🇭 ${w.ceb}`;
                        wrongIndex++;
                    }
                }
                
            } else if (questionType === 2) {
                currentQuestion = sentenceDB[Math.floor(Math.random() * sentenceDB.length)];
                document.getElementById("qText").innerText = `Fill in the blank!`;
                
                let displaySentence = currentQuestion.de.replace(currentQuestion.answer, "___");
                
                document.getElementById("tText").innerText = `🇩🇪 ${displaySentence}\n🇬🇧 ${currentQuestion.en} \n🇵🇭 ${currentQuestion.ceb}`;
                document.getElementById("typeArea").classList.remove("hidden");
                document.getElementById("answerInput").focus();
            }
        }

        document.getElementById("answerInput").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                event.preventDefault();
                if(document.getElementById("nextBtn").classList.contains("hidden")) {
                    checkAnswer();
                } else {
                    nextQuestion();
                }
            }
        });

        function checkAnswer() {
            let userInput = document.getElementById("answerInput").value.trim().toLowerCase();
            let correctAnswer = (questionType === 2) ? currentQuestion.answer.toLowerCase() : currentQuestion.de.toLowerCase();
            
            if (userInput === correctAnswer) {
                handleCorrect();
            } else {
                handleWrong(correctAnswer);
            }
        }

        function checkChoice(btnNum) {
            if (btnNum === correctChoice) {
                handleCorrect();
            } else {
                let correctAnswerText = `${currentQuestion.en} / ${currentQuestion.ceb}`;
                handleWrong(correctAnswerText);
            }
        }

        function handleCorrect() {
            playSound('correct');
            let feedback = document.getElementById("feedbackArea");
            feedback.innerText = "Correct! 🎉";
            feedback.className = "feedback correct";
            score++;
            document.getElementById("scoreDisplay").innerText = score;
            checkAchievements();
            showNextButton();
        }

        function handleWrong(correctString) {
            playSound('wrong');
            let feedback = document.getElementById("feedbackArea");
            feedback.innerText = `Wrong! ❌ The correct answer is: ${correctString}`;
            feedback.className = "feedback wrong";
            showNextButton();
        }

        function showNextButton() {
            if(questionType === 0 || questionType === 2) {
                document.getElementById("typeArea").classList.add("hidden");
            } else {
                document.getElementById("choiceArea").classList.add("hidden");
            }
            document.getElementById("nextBtn").classList.remove("hidden");
            document.getElementById("nextBtn").focus();
        }

        function checkAchievements() {
            if (achievements.includes(score) && !achievedLevels.includes(score)) {
                achievedLevels.push(score);
                playSound('achievement');
                showAchievement(`🏆 Fantastic! ${score} correct answers!`);
            }
        }

        function showAchievement(text) {
            let popup = document.getElementById("achievement-popup");
            popup.innerText = text;
            popup.style.display = "block";
            setTimeout(() => {
                popup.style.display = "none";
            }, 4000);
        }
    </script>
</body>
</html>
